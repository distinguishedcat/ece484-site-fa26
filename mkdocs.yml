site_name: ECE484 Principles of Safe Autonomy
site_url: https://safeautonomy-illinois.github.io/ece484-site/
repo_url: https://github.com/safeautonomy-illinois/ece484-site
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
  icon:
    logo: material/robot
  favicon: assets/images/favicon.png

plugins:
  - search

markdown_extensions:
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/scroll-reveal.js

nav:
  - Overview: index.md
  - Schedule: fall-2026/lectures.md
  - Assignments: fall-2026/assignments.md
  - Team: fall-2026/team.md
  - Projects:
      - Overview: fall-2026/projects.md
      - Quadrotor: fall-2026/projects/quadrotor/index.md
      - RacingSim (GRAIC): fall-2026/projects/racing-sim/index.md
      - F1tenth: fall-2026/projects/f1tenth/index.md
      - Robotaxi (GEM): fall-2026/projects/robotaxi/index.md
  - Resources: fall-2026/resources.md
  - Policies: fall-2026/policies.md
  - Archive:
      - Overview: archive/index.md
      - Spring 2026:
          - Schedule: archive/spring-2026/lectures.md
          - Assignments: archive/spring-2026/assignments.md
          - Team: archive/spring-2026/team.md
          - Projects:
              - Overview: archive/spring-2026/projects.md
              - Quadrotor: archive/spring-2026/projects/quadrotor/index.md
              - RacingSim (GRAIC): archive/spring-2026/projects/racing-sim/index.md
              - F1tenth: archive/spring-2026/projects/f1tenth/index.md
              - Robotaxi (GEM): archive/spring-2026/projects/robotaxi/index.md
          - Resources: archive/spring-2026/resources.md
          - Policies: archive/spring-2026/policies.md
      - Fall 2025:
          - Overview: archive/fall-2025/index.md
          - Schedule: archive/fall-2025/lectures.md
          - Assignments: archive/fall-2025/assignments.md
          - Team: archive/fall-2025/team.md
          - Projects: archive/fall-2025/projects.md
          - Resources: archive/fall-2025/resources.md
          - Policies: archive/fall-2025/policies.md
      - Spring 2025: https://publish.illinois.edu/safe-autonomy/home-spring-2025/
      - Spring 2024: https://publish.illinois.edu/safe-autonomy/home-spring-2024-2/
      - Fall 2022: https://publish.illinois.edu/safe-autonomy/home-spring-2022/
      - Spring 2022: https://publish.illinois.edu/safe-autonomy/home-spring-2022-2/
